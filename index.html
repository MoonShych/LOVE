<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ถึงอ้วน 💌</title>

<!-- ฟอนต์ไทยสไตล์หรู: Charm สำหรับหัวเรื่อง (ตัวเขียนอ่อนหวาน), Prompt สำหรับเนื้อหา -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@400;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= พื้นหลังทั่วทั้งเว็บ: ดาวระยิบระยับ + หัวใจลอย ================= -->
  <div id="bg-stars" aria-hidden="true"></div>
  <div id="bg-hearts" aria-hidden="true"></div>

  <!-- ================= ปุ่มควบคุมเพลง (โผล่มาหลังเปิดซอง) ================= -->
  <div id="music-player" class="hidden">
    <button id="music-toggle" aria-label="เปิด/ปิดเพลง">
      <span id="music-icon">🎵</span>
    </button>
    <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="ปรับระดับเสียง">
  </div>
  <!-- ผู้ใช้สามารถเปลี่ยนไฟล์เพลงได้ที่ music.mp3 -->
  <audio id="bg-music" src="music.mp3" loop preload="none"></audio>

  <!-- ================= ฉากที่ 1: หน้าเปิด / ซองจดหมาย 3 มิติ ================= -->
  <section id="intro-scene">
    <div class="envelope-wrap">
      <div id="envelope" class="envelope" role="button" tabindex="0" aria-label="แตะเพื่อเปิดจดหมาย">

        <div class="envelope-back"></div>

        <!-- กระดาษจดหมายที่จะเลื่อนขึ้นตอนเปิด -->
        <div class="envelope-paper">
          <p class="paper-heart">💌</p>
          <p class="paper-line">ถึงอ้วน</p>
          <p class="paper-heart small">❤️</p>
        </div>

        <div class="envelope-flap"></div>

        <div class="envelope-front">
          <span class="envelope-emoji">💌</span>
          <span class="envelope-title">ถึงอ้วน ❤️</span>
        </div>

        <div class="envelope-seal">❤</div>
      </div>

      <p id="tap-hint">แตะเพื่อเปิดจดหมาย</p>
    </div>
  </section>

  <!-- ================= ฉากที่ 2: จดหมาย (Typewriter) ================= -->
  <section id="letter-scene">
    <div class="letter-card">
      <div class="letter-corner top-left">❀</div>
      <div class="letter-corner top-right">❀</div>

      <div id="typewriter-text" class="typewriter-text"></div>
      <span id="typewriter-cursor" class="typewriter-cursor">|</span>

      <div class="letter-corner bottom-left">❀</div>
      <div class="letter-corner bottom-right">❀</div>
    </div>

    <!-- ================= ตัวนับเวลาที่คบกัน ================= -->
    <div id="love-counter" class="love-counter">
      <p class="counter-title">เราอยู่ด้วยกันมาแล้ว</p>
      <div class="counter-grid">
        <div class="counter-box">
          <span id="count-days" class="counter-num">0</span>
          <span class="counter-label">วัน</span>
        </div>
        <div class="counter-box">
          <span id="count-hours" class="counter-num">0</span>
          <span class="counter-label">ชั่วโมง</span>
        </div>
        <div class="counter-box">
          <span id="count-minutes" class="counter-num">0</span>
          <span class="counter-label">นาที</span>
        </div>
        <div class="counter-box">
          <span id="count-seconds" class="counter-num">0</span>
          <span class="counter-label">วินาที</span>
        </div>
      </div>
      <p class="counter-since">นับจาก 01/10/2025</p>
    </div>

    <div class="scroll-down-hint">
      <span>เลื่อนลงเพื่อดูความทรงจำของเรา</span>
      <span class="scroll-arrow">↓</span>
    </div>
  </section>

  <!-- ================= ฉากที่ 3: แกลเลอรีรูปภาพ ================= -->
  <section id="gallery-scene">
    <h2 class="gallery-title">รูป</h2>

    <div class="gallery-grid">
      <!-- แต่ละรูปมี data-effect กำหนดแอนิเมชันตอนเลื่อนหน้าจอ: fade / zoom / parallax / slide-left / slide-right -->
      <figure class="gallery-item" data-effect="fade">
        <img src="1.jpeg" alt="ความทรงจำ 1" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
      <figure class="gallery-item" data-effect="slide-left">
        <img src="2.jpeg" alt="ความทรงจำ 2" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
      <figure class="gallery-item" data-effect="zoom">
        <img src="3.png" alt="ความทรงจำ 3" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
      <figure class="gallery-item" data-effect="slide-right">
        <img src="4.jpg" alt="ความทรงจำ 4" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
      <figure class="gallery-item" data-effect="parallax">
        <img src="5.jpeg" alt="ความทรงจำ 5" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
      <figure class="gallery-item" data-effect="fade">
        <img src="6.jpeg" alt="ความทรงจำ 6" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
      <figure class="gallery-item" data-effect="slide-left">
        <img src="7.jpeg" alt="ความทรงจำ 7" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
      <figure class="gallery-item" data-effect="zoom">
        <img src="8.jpeg" alt="ความทรงจำ 8" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
      <figure class="gallery-item" data-effect="slide-right">
        <img src="9.jpeg" alt="ความทรงจำ 9" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
      <figure class="gallery-item" data-effect="parallax">
        <img src="10.jpeg" alt="ความทรงจำ 10" loading="lazy" onerror="this.parentElement.classList.add('img-fallback')">
        <figcaption>💗</figcaption>
      </figure>
    </div>
  </section>

  <!-- ================= ฉากที่ 4: ตอนจบ ================= -->
  <section id="ending-scene">
    <div id="petals-fall" aria-hidden="true"></div>
    <div id="confetti-layer" aria-hidden="true"></div>

    <div class="ending-content">
      <div class="big-heart">❤</div>
      <h1 class="ending-text">รักอ้วนมากที่สุด ❤️</h1>
      <p class="ending-sub">จากคนที่รักอ้วนที่สุด</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
