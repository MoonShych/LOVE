<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>สำหรับคนพิเศษของเค้า ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================
     PAGE 1 — LOCK SCREEN
     PIN unlock using a custom numeric keypad (no <input>, no
     mobile keyboard). PIN = 011025
============================================================ -->
<section id="page-lock" class="page page-active">
  <div class="glow-blob glow-blob-a"></div>
  <div class="glow-blob glow-blob-b"></div>
  <div class="dust-layer" id="dust-lock"></div>

  <div class="lock-content">
    <div class="lock-heart">❤️</div>
    <p class="lock-title">สำหรับคนพิเศษของเค้า ❤️</p>

    <div class="pin-dots" id="pin-dots">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>

    <div class="keypad" id="keypad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-back" data-key="back">⌫</button>
      <button class="key" data-key="0">0</button>
      <button class="key key-heart" data-key="heart">❤</button>
    </div>
  </div>

  <div class="lock-mask" id="lock-mask"></div>
</section>

<!-- ============================================================
     PAGE 2 — HEART CURTAIN TRANSITION
     Left/right walls of hearts sweep to center, bloom, then
     part like a theatre curtain to reveal page 3.
============================================================ -->
<section id="page-curtain" class="page">
  <div class="curtain-side curtain-left" id="curtain-left"></div>
  <div class="curtain-side curtain-right" id="curtain-right"></div>
</section>

<!-- ============================================================
     PAGE 3 — ENVELOPE
============================================================ -->
<section id="page-envelope" class="page">
  <div class="soft-hearts-bg" id="dust-envelope"></div>
  <button class="music-toggle" id="music-toggle" aria-label="เปิด/ปิดเพลง">🎵</button>

  <div class="envelope-wrap">
    <p class="envelope-hint">แตะเพื่อเปิด</p>
    <div class="envelope-3d" id="envelope">
      <div class="envelope-back"></div>
      <div class="paper" id="envelope-paper">
        <p>ถึงคนที่เค้ารัก...</p>
      </div>
      <div class="envelope-flap" id="envelope-flap"></div>
      <div class="envelope-front"></div>
      <div class="envelope-seal">❤</div>
    </div>
  </div>
</section>

<!-- ============================================================
     PAGE 4 — LOVE LETTER (typewriter)
============================================================ -->
<section id="page-letter" class="page">
  <div class="soft-hearts-bg" id="dust-letter"></div>
  <div class="letter-sheet">
    <p id="letter-text" class="letter-text"></p>
    <span class="typewriter-cursor" id="letter-cursor">|</span>
    <button class="next-btn" id="letter-next-btn" style="display:none;">ดูต่อ →</button>
  </div>
</section>

<!-- ============================================================
     PAGE 5 — GALLERY (swipe)
============================================================ -->
<section id="page-gallery" class="page">
  <h2 class="section-title">ความทรงจำของเรา ❤️</h2>
  <div class="gallery-wrap">
    <div class="gallery-track" id="gallery-track">
      <!-- slides injected by script.js from assets/images -->
    </div>
    <div class="gallery-dots" id="gallery-dots"></div>
  </div>
  <button class="next-btn" id="gallery-next-btn">ดูต่อ →</button>

  <div class="fullscreen-viewer" id="fullscreen-viewer">
    <img id="fullscreen-img" src="" alt="">
  </div>
</section>

<!-- ============================================================
     PAGE 6 — ANNIVERSARY COUNTER
============================================================ -->
<section id="page-counter" class="page">
  <div class="soft-hearts-bg" id="dust-counter"></div>
  <h2 class="section-title">เราอยู่ด้วยกันมาแล้ว ❤️</h2>

  <div class="counter-grid">
    <div class="counter-box">
      <span class="counter-num" id="count-days">0</span>
      <span class="counter-label">วัน</span>
    </div>
    <div class="counter-box">
      <span class="counter-num" id="count-hours">0</span>
      <span class="counter-label">ชม.</span>
    </div>
    <div class="counter-box">
      <span class="counter-num" id="count-minutes">0</span>
      <span class="counter-label">นาที</span>
    </div>
    <div class="counter-box">
      <span class="counter-num" id="count-seconds">0</span>
      <span class="counter-label">วิฯ</span>
    </div>
  </div>

  <p class="counter-caption">ทุกวินาทีที่มีเธอ มีความหมายสำหรับเค้า ❤️</p>
  <button class="next-btn" id="counter-next-btn">ดูต่อ →</button>
</section>

<!-- ============================================================
     PAGE 7 — VOICE MESSAGE
============================================================ -->
<section id="page-voice" class="page">
  <div class="soft-hearts-bg" id="dust-voice"></div>
  <div class="voice-card">
    <div class="voice-mic">🎙️</div>
    <p class="voice-title">ข้อความเสียงจากเค้า ❤️</p>
    <button class="voice-play-btn" id="voice-play-btn">▶ เล่น</button>
    <div class="voice-wave" id="voice-wave">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>
  <button class="next-btn" id="voice-next-btn">ดูต่อ →</button>
</section>

<!-- ============================================================
     PAGE 8 — ENDING
============================================================ -->
<section id="page-ending" class="page">
  <div class="ending-stars" id="ending-stars"></div>
  <div class="soft-hearts-bg" id="dust-ending"></div>

  <div class="ending-content">
    <p id="ending-text" class="ending-text"></p>
    <span class="typewriter-cursor" id="ending-cursor">|</span>
    <button class="hug-btn" id="hug-btn" style="display:none;">❤️ กอดหน่อย ❤️</button>
  </div>

  <div class="hug-burst" id="hug-burst"></div>
</section>

<!-- audio elements -->
<audio id="audio-song" src="assets/song.mp3" loop></audio>
<audio id="audio-voice" src="assets/voice.mp3"></audio>
<audio id="audio-unlock" src="assets/unlock.mp3"></audio>
<audio id="audio-click" src="assets/click.mp3"></audio>
<audio id="audio-whoosh" src="assets/whoosh.mp3"></audio>
<audio id="audio-paper" src="assets/paper.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
